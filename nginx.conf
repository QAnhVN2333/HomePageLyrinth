# Redirect root path to /projects/mc-server and proxy app traffic to Node.js.
# This file belong to nginx projects.
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    tcp_nodelay on;
    tcp_nopush on;
    gzip on;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        application/xml
        application/rss+xml
        image/svg+xml;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    map $http_x_forwarded_proto $origin_proto {
        default $http_x_forwarded_proto;
        ''      $scheme;
    }

    map $http_x_forwarded_port $origin_port {
        default $http_x_forwarded_port;
        ''      $server_port;
    }

    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Port $origin_port;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $origin_proto;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_http_version 1.1;
    proxy_ssl_server_name on;
    proxy_ssl_name lyrinth-home-page.fly.dev;
    upstream app_backend {
        server lyrinth-home-page.fly.dev:443;
    }

    server {
        client_max_body_size 10M;
        listen 8080;
        server_name smp.lyrinth.com;

        location /api/ {
            proxy_pass https://app_backend/api/;
        }

        location ^~ /assets/ {
            proxy_pass https://app_backend/assets/;
        }

        location = /favicon-smp.svg {
            proxy_pass https://app_backend/favicon-smp.svg;
        }

        location / {
                        proxy_set_header Host $host;
                        rewrite ^/(?!projects/mc-server/)(.*)$ /projects/mc-server/$1 break;
                        proxy_pass https://app_backend;
                        proxy_redirect ~^https?://lyrinth-home-page\.fly\.dev/projects/mc-server/?(.*)$ $scheme://$host/$1;
                        proxy_redirect ~^https?://app_backend/projects/mc-server/?(.*)$ $scheme://$host/$1;
                        proxy_redirect ~^/projects/mc-server/?(.*)$ /$1;
        }
    }
    server {
            client_max_body_size 10M;
            listen 8080;
            server_name minigames.lyrinth.com;
            location /api/ {
                proxy_pass https://app_backend/api/;
            }

            location ^~ /assets/ {
                proxy_pass https://app_backend/assets/;
            }

            location = /favicon-minigames.svg {
                proxy_pass https://app_backend/favicon-minigames.svg;
            }

            location / {
                proxy_set_header Host $host;
                rewrite ^/(?!projects/mc-minigames-server/)(.*)$ /projects/mc-minigames-server/$1 break;
                proxy_pass https://app_backend;
                proxy_redirect ~^https?://lyrinth-home-page\.fly\.dev/projects/mc-minigames-server/?(.*)$ $scheme://$host/$1;
                proxy_redirect ~^https?://app_backend/projects/mc-minigames-server/?(.*)$ $scheme://$host/$1;
                proxy_redirect ~^/projects/mc-minigames-server/?(.*)$ /$1;
            }
    }
}

